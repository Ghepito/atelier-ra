name: Publier le portail

on:
  push:
    branches: [ main ]
    paths: [ 'site/**', 'marqueurs/**', '.github/workflows/site.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Joindre la planche de marqueurs
        run: cp marqueurs/marqueurs-appli.pdf site/marqueurs-appli.pdf
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
