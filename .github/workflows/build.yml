name: Compiler l'APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler
        run: ./gradlew --no-daemon assembleDebug

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AtelierRA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AtelierRA-apk
          path: AtelierRA.apk

      - name: Publier la dernière version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete derniere-version --yes --cleanup-tag || true
          gh release create derniere-version AtelierRA.apk \
            --title "Atelier RA — dernière version" \
            --notes "Compilée automatiquement depuis le commit ${GITHUB_SHA::7}. Téléchargez AtelierRA.apk sur le téléphone puis ouvrez-le pour l'installer." \
            --latest
