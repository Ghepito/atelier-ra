name: Compiler l'APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      # Le SDK Android est préinstallé sur les machines GitHub (ANDROID_HOME).
      - name: Préparer le SDK Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null || true

      - name: Compiler
        run: |
          set -o pipefail
          chmod +x gradlew
          echo "Plateformes installées : $(ls $ANDROID_HOME/platforms | tr '\n' ' ')" > build.log
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee -a build.log

      - name: Remonter les erreurs
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          # Résumé des erreurs en annotations (lisibles via l'API GitHub)
          grep -E "^e: |error:|What went wrong|Could not|> |Execution failed|FAILED|Unresolved|Exception" build.log | head -60 > erreurs.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' erreurs.txt | cut -c1-60000)
          echo "::error title=Erreurs de compilation::${msg}"
          # Journal complet sur la branche journal-compilation
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp build.log /tmp/build.log
          git checkout --orphan journal-compilation
          git rm -rf --cached . > /dev/null
          cp /tmp/build.log build.log
          git add -f build.log
          git commit -m "Journal de compilation ${GITHUB_SHA::7}" > /dev/null
          git push -f origin journal-compilation

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AtelierRA.apk

      - uses: actions/upload-artifact@v5
        with:
          name: AtelierRA-apk
          path: AtelierRA.apk

      - name: Publier la dernière version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete derniere-version --yes --cleanup-tag || true
          gh release create derniere-version AtelierRA.apk marqueurs/marqueurs-appli.pdf \
            --title "Atelier RA — version ${GITHUB_RUN_NUMBER}" \
            --notes "Compilée automatiquement depuis le commit ${GITHUB_SHA::7}. Téléchargez AtelierRA.apk sur le téléphone puis ouvrez-le pour l'installer. Les marqueurs à imprimer sont dans marqueurs-appli.pdf." \
            --latest
